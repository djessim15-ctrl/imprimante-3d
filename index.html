/* ------------------------------------------------------------ validation */
const AI_FIELDS = {
  add_filament: { requis: ['name'], num: ['spoolWeight', 'spoolPrice', 'stockSpools', 'remaining'] },
  add_filaments: { requete: true },
  update_filament: { requete: ['id'] },
  delete_filament: { requete: ['id'] },
  add_product: { requise: ['name'], num: ['weightG', 'printHours', 'printMin', 'priceOverride', 'stock', 'qtyPerPlate', 'multiplier'] },
  add_products: { requete: true },
  update_product: { requete: ['id'] },
  delete_product: { requete: ['id'] },
  update_settings: { requete: [] },
  delete_sales: { requete: ['id'] }
};

const nb = (v) => typeof v === 'number' && Number.isFinite(v) ? v : (typeof v === 'string' && v.trim() !== '' && Number.isFinite(+v) ? +v : null);
const hexOk = (v) => typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v);
const matOk = (v) => typeof v === 'string' && v.trim() ? v.trim() : null;

function findFil(id) { return S.filaments.find(f => f.id === id) || null; }
function findProd(id) { return S.products.find(p => p.id === id) || null; }

/* Normalise et vérifie une action. Lève une Error si inutilisable.
   Renvoie { act, label } : une action propre + le texte montré à l'utilisateur. */
function validateAI(a) {
  if (!a || typeof a !== 'object' || typeof a.type !== 'string') throw Error('action non reconnue');

  switch (a.type) {
    /* ---------------------------------------------------------- filaments */
    case 'add_filament': {
      const name = (a.name || '').toString().trim();
      const sw = nb(a.spoolWeight), sp = nb(a.spoolPrice);
      if (!name) throw Error('filament sans nom');
      if (sw === null || sw < 1) throw Error(`poids de bobine manquant pour « ${name} »`);
      if (sp === null || sp < 0) throw Error(`prix manquant pour « ${name} »`);
      const mat = matOk(a.material) || 'PLA';
      const hex = hexOk(a.colorHex) ? a.colorHex.toLowerCase() : '#94a3b8';
      const stock = nb(a.stockSpools) ?? 1;
      const remaining = nb(a.remaining) ?? 0;
      return {
        act: { type: 'add_filament', name, material: mat, colorHex: hex, spoolWeight: sw, spoolPrice: sp, stockSpools: stock, remaining, brand: (a.brand || '').toString().slice(0, 60) },
        label: `Ajouter « ${name} » — ${mat} ${hex}, bobine ${sw} g, ${sp} €, stock ${stock}`
      };
    }
    case 'add_filaments': {
      if (!Array.isArray(a.items) || !a.items.length) throw Error('aucun filament dans la liste');
      const items = a.items.slice(0, 40).map(it => {
        const v = validateAI({ ...it, type: 'add_filament' });
        return v.act;
      });
      const resume = items.slice(0, 6).map(i => `${i.name} (${i.stockSpools}×${i.spoolWeight} g, ${i.spoolPrice} €)`).join(', ');
      return { act: { type: 'add_filaments', items }, label: `Ajouter ${items.length} filaments : ${resume}${items.length > 6 ? '…' : ''}` };
    }
    case 'update_filament': {
      const f = findFil(a.id);
      if (!f) throw Error(`filament inconnu (id ${a.id})`);
      const patch = {};
      if (a.name != null && String(a.name).trim()) patch.name = String(a.name).trim();
      if (a.material != null) patch.material = String(a.material);
      if (a.colorHex != null) { if (!hexOk(a.colorHex)) throw Error('couleur invalide'); patch.colorHex = a.colorHex.toLowerCase(); }
      if (a.brand != null) patch.brand = String(a.brand).slice(0, 60);
      if (a.note != null) patch.note = String(a.note).slice(0, 200);
      for (const k of ['spoolWeight', 'spoolPrice', 'stockSpools', 'remaining']) {
        const v = nb(a[k]);
        if (v !== null) { if (v < 0) throw Error(`valeur négative pour ${k}`); patch[k] = v; }
      }
      if (!Object.keys(patch).length) throw Error('aucune modification indiquée');
      const before = Object.entries(patch).map(([k, v]) => `${k}: ${f[k]} → ${v}`).join(', ');
      return { act: { type: 'update_filament', id: f.id, patch }, label: `Modifier « ${f.name} » — ${before}` };
    }
    case 'delete_filament': {
      const f = findFil(a.id);
      if (!f) throw Error(`filament inconnu (id ${a.id})`);
      const used = S.products.filter(p => p.filamentId === f.id);
      if (used.length) throw Error(`« ${f.name} » est utilisé par ${used.length} objet(s) : change-leur filament d’abord`);
      return { act: { type: 'delete_filament', id: f.id }, label: `SUPPRIMER le filament « ${f.name} »` };
    }

    /* ------------------------------------------------------------- objets */
    case 'add_product': {
      const name = (a.name || '').toString().trim();
      if (!name) throw Error('objet sans nom');
      const w = nb(a.weightG);
      const h = nb(a.printHours) ?? 0;
      const m = nb(a.printMin) ?? 0;
      if (w === null || w <= 0) throw Error(`poids manquant pour « ${name} »`);
      if (h <= 0 && m <= 0) throw Error(`temps d’impression manquant pour « ${name} »`);
      let filId = a.filamentId;
      if (filId && !findFil(filId)) throw Error(`filament inconnu (id ${filId})`);
      const price = nb(a.priceOverride);
      return {
        act: {
          type: 'add_product', name, filamentId: filId || null, weightG: w,
          printHours: h, printMin: m, qtyPerPlate: Math.max(1, nb(a.qtyPerPlate) ?? 1),
          postMin: nb(a.postMin), packaging: nb(a.packaging),
          multiplier: nb(a.multiplier) ?? 2.5,
          priceOverride: price !== null && price > 0 ? price : null,
          stock: nb(a.stock) ?? 0, description: (a.description || '').toString().slice(0, 400),
          sku: (a.sku || '').toString().slice(0, 40),
          emoji: ICONS[a.emoji] ? a.emoji : 'cube', active: a.active === false ? false : true
        },
        label: `Créer « ${name} » — ${w} g, ${h} h ${m} min${price ? ', prix ' + price + ' €' : ', prix automatique'}`
      };
    }
    case 'add_products': {
      if (!Array.isArray(a.items) || !a.items.length) throw Error('aucun objet dans la liste');
      const items = a.items.slice(0, 40).map(it => validateAI({ ...it, type: 'add_product' }).act);
      return {
        act: { type: 'add_products', items },
        label: `Créer ${items.length} objets : ${items.slice(0, 5).map(i => i.name).join(', ')}${items.length > 5 ? '…' : ''}`
      };
    }
    case 'update_product': {
      const p = findProd(a.id);
      if (!p) throw Error(`objet inconnu (id ${a.id})`);
      const patch = {};
      if (a.name != null && String(a.name).trim()) patch.name = String(a.name).trim();
      if (a.description != null) patch.description = String(a.description).slice(0, 400);
      if (a.sku != null) patch.sku = String(a.sku).slice(0, 40);
      if (a.filamentId !== undefined) {
        if (a.filamentId && !findFil(a.filamentId)) throw Error('filament inconnu');
        patch.filamentId = a.filamentId || null;
      }
      if (typeof a.active === 'boolean') patch.active = a.active;
      if (ICONS[a.emoji]) patch.emoji = a.emoji;
      for (const k of ['weightG', 'printHours', 'printMin', 'qtyPerPlate', 'multiplier', 'stock']) {
        const v = nb(a[k]);
        if (v !== null) { if (v < 0) throw Error(`valeur négative pour ${k}`); patch[k] = v; }
      }
      for (const k of ['postMin', 'packaging', 'priceOverride']) {
        if (a[k] === null) patch[k] = null;
        else { const v = nb(a[k]); if (v !== null) patch[k] = v; }
      }
      if (!Object.keys(patch).length) throw Error('aucune modification indiquée');
      const before = Object.entries(patch).map(([k, v]) => `${k}: ${p[k] ?? '—'} → ${v ?? '—'}`).join(', ');
      return { act: { type: 'update_product', id: p.id, patch }, label: `Modifier « ${p.name} » — ${before}` };
    }
    case 'delete_product': {
      const p = findProd(a.id);
      if (!p) throw Error(`objet inconnu (id ${a.id})`);
      return { act: { type: 'delete_product', id: p.id }, label: `SUPPRIMER l’objet « ${p.name} »` };
    }

    /* ----------------------------------------------------------- réglages */
    case 'update_settings': {
      const allowed = {
        shopName: 'str', shopTagline: 'str', shopContact: 'str', printerName: 'str', currency: 'str',
        printerPrice: 'num', printerLifeHours: 'num', maintenancePerHour: 'num', printerWatts: 'num',
        elecPricePerKwh: 'num', laborPerHour: 'num', postProcessMin: 'num', failRatePct: 'num',
        packagingCost: 'num', shippingCost: 'num', platformFeePct: 'num', paymentFeePct: 'num',
        paymentFeeFixed: 'num', targetMarginPct: 'num', vatPct: 'num'
      };
      const patch = {};
      for (const [k, kind] of Object.entries(allowed)) {
        if (a[k] === undefined || a[k] === null) continue;
        if (kind === 'num') {
          const v = nb(a[k]);
          if (v === null || v < 0) throw Error(`valeur invalide pour ${k}`);
          patch[k] = v;
        } else patch[k] = String(a[k]).slice(0, 120);
      }
      if (typeof a.vatEnabled === 'boolean') patch.vatEnabled = a.vatEnabled;
      if (!Object.keys(patch).length) throw Error('aucun réglage indiqué');
      const before = Object.entries(patch).map(([k, v]) => `${k}: ${S.settings[k]} → ${v}`).join(', ');
      return { act: { type: 'update_settings', patch }, label: `Modifier les réglages — ${before}` };
    }

    /* -------------------------------------------------------------- ventes */
    case 'delete_sales': {
      const ids = Array.isArray(a.ids) ? a.ids : (a.id ? [a.id] : []);
      const found = ids.map(findSale).filter(Boolean);
      if (!found.length) throw Error('vente introuvable');
      return {
        act: { type: 'delete_sales', ids: found.map(s => s.id) },
        label: `SUPPRIMER ${found.length} vente(s) — ${found.slice(0, 4).map(s => `${s.productName} (${frDate(s.date)})`).join(', ')}`
      };
    }

    default:
      throw Error('action non prise en charge : ' + a.type);
  }
}

function findSale(id) { return S.sales.find(s => s.id === id) || null; }

/* ------------------------------------------------------------ exécution */
function applyAIActions(actions) {
  const done = [];
  for (const a of actions) {
    switch (a.type) {
      case 'add_filament':
        S.filaments.push({ id: uid(), brand: '', note: '', ...a });
        done.push(a.name);
        break;
      case 'add_filaments':
        a.items.forEach(i => { S.filaments.push({ id: uid(), brand: '', note: '', ...i }); done.push(i.name); });
        break;
      case 'update_filament':
        Object.assign(findFil(a.id), a.patch); done.push('filament');
        break;
      case 'delete_filament':
        S.filaments = S.filaments.filter(f => f.id !== a.id); done.push('filament supprimé');
        break;
      case 'add_product':
      case 'add_products': {
        const items = a.type === 'add_products' ? a.items : [a];
        items.forEach(i => {
          S.products.push({
            id: uid(), ...i, qtyPerPlate: i.qtyPerPlate || 1,
            postMin: i.postMin ?? null, packaging: i.packaging ?? null,
            multiplier: i.multiplier || 2.5, priceOverride: i.priceOverride ?? null,
            emoji: i.emoji || 'cube', active: i.active !== false
          });
          done.push(i.name);
        });
        break;
      }
      case 'update_product':
        Object.assign(findProd(a.id), a.patch); done.push('objet modifié');
        break;
      case 'delete_product':
        S.products = S.products.filter(p => p.id !== a.id); done.push('objet supprimé');
        break;
      case 'update_settings':
        Object.assign(S.settings, a.patch); done.push('réglages');
        break;
      case 'delete_sales':
        S.sales = S.sales.filter(s => !a.ids.includes(s.id)); done.push(a.ids.length + ' vente(s) supprimée(s)');
        break;
    }
  }
  return done;
}

function applyAI() {
  if (!aiPending) return;
  const destructive = aiPending.actions.filter(a => a.type.startsWith('delete_'));
  if (destructive.length && !confirm(`Cette action supprime définitivement :\n\n${destructive.map(a => '• ' + a.label).join('\n')}\n\nContinuer ?`)) return;
  let done;
  try {
    done = applyAIActions(aiPending.actions);
  } catch (e) {
    aiPending = null; paintAI(); return toast('⚠️ ' + e.message);
  }
  save();
  aiPending = null;
  aiMessages.push({ role: 'assistant', text: `C’est fait : ${done.length} changement(s) enregistré(s).` });
  render();
  toast('Modifications enregistrées ✓');
  paintAI();
}

const AI_REMOTE = 'https://imprimante-3d.vercel.app/api/chat';

async function aiFetch(messages) {
  const body = JSON.stringify({ messages });
  const opts = { method: 'POST', headers: { 'Content-Type': 'application/json' }, body };
  let first;
  try { first = await fetch('/api/chat', opts); }
  catch (e) { return fetch(AI_REMOTE, opts); }
  if (first.status !== 500 && first.status !== 404) return first;
  try {
    const second = await fetch(AI_REMOTE, opts);
    if (second.ok) return second;
  } catch (e) {}
  return first;
}

function aiSystemPrompt() {
  return `Tu es l'assistant agent d'un atelier d'impression 3D. Tu réponds TOUJOURS en JSON valide, sans texte autour.

Format exact :
{"message":"réponse courte en français","actions":[]}

"actions" est une LISTE (0 à 20 éléments). Chaque élément a un "type" :

1. {"type":"add_filament","name":str,"material":str,"colorHex":"#rrggbb","spoolWeight":nb,"spoolPrice":nb,"stockSpools":nb,"remaining":nb,"brand":str}
2. {"type":"add_filaments","items":[ ...plusieurs add_filament... ]}  ← pour "ajoute 10 bobines" ou plusieurs couleurs
3. {"type":"update_filament","id":str,"name":str?,"material":str?,"colorHex":str?,"spoolWeight":nb?,"spoolPrice":nb?,"stockSpools":nb?,"remaining":nb?,"brand":str?}
4. {"type":"delete_filament","id":str}
5. {"type":"add_product","name":str,"filamentId":str,"weightG":nb,"printHours":nb,"printMin":nb,"qtyPerPlate":nb,"postMin":nb,"packaging":nb,"multiplier":nb,"priceOverride":nb,"stock":nb,"description":str,"emoji":str}
6. {"type":"add_products","items":[ ...plusieurs add_product... ]}
7. {"type":"update_product","id":str, ...champs à changer...}
8. {"type":"delete_product","id":str}
9. {"type":"update_settings","elecPricePerKwh":nb?,"laborPerHour":nb?,"failRatePct":nb?,"printerWatts":nb?,"packagingCost":nb?,"shippingCost":nb?,"platformFeePct":nb?,"paymentFeePct":nb?,"paymentFeeFixed":nb?,"targetMarginPct":nb?,"vatPct":nb?,"vatEnabled":bool?,"shopName":str?,"printerName":str?}
10. {"type":"delete_sales","ids":[str,...]}

RÈGLES IMPORTANTES
- Utilise EXACTEMENT les ids présents dans l'état fourni. N'invente jamais d'id.
- Tu peux enchaîner plusieurs actions dans la même réponse (ex. créer 10 filaments + 3 objets).
- Pour "ajoute 10 bobines de PLA noir", écris add_filaments avec 10 éléments, ou un seul élément avec "stockSpools":10 — préfère stockSpools pour ne pas dépasser 20 actions.
- Couleurs : code hexadécimal réaliste (noir #111827, blanc #ffffff, rouge #ef4444, bleu #3b82f6, vert #22c55e, gris #9ca3af, or #fbbf24, transparent/naturel #e5e7eb).
- Matières : PLA, PLA+, PETG, ABS, ASA, TPU, Nylon, PC, PVA.
- Si une info indispensable manque (poids, temps, prix d'un objet), pose UNE question dans "message" et renvoie "actions":[].
- N'invente pas le poids ou le temps d'impression d'un objet : demande-les.
- Pour une question d'analyse (marges, stock), "actions":[] et réponds dans "message" avec des chiffres issus de l'état.
- Ne dis jamais que c'est déjà fait : les actions seront proposées puis confirmées.
- Les nombres sont des nombres JSON, pas des chaînes.
- "emoji" : une clé parmi ${Object.keys(ICONS).filter(k => k !== 'cart').join(', ')} — sinon "cube".

État réel de l'atelier :
${JSON.stringify(aiState())}`;
}

async function sendAI(e) {
  e.preventDefault();
  if (aiBusy) return;
  if (aiPending) { toast('Confirme ou annule d’abord la proposition en cours.'); return; }
  const input = document.getElementById('ai-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  aiMessages.push({ role: 'user', text });
  aiBusy = true;
  const btn = document.getElementById('ai-send');
  if (btn) btn.disabled = true;
  paintAI();

  try {
    const messages = [
      { role: 'system', content: aiSystemPrompt() },
      ...aiMessages.slice(-10).map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text }))
    ];
    const res = await aiFetch(messages);
    const data = await res.json();
    if (!res.ok) throw Error(data.error || 'Erreur de connexion');
    let out;
    try { out = JSON.parse(data.content); }
    catch (e) { throw Error('réponse illisible de l’assistant'); }

    const raw = Array.isArray(out.actions) ? out.actions
      : (out.action ? [out.action] : []);
    const valid = [];
    const errors = [];
    for (const a of raw.slice(0, 20)) {
      try { valid.push(validateAI(a)); }
      catch (err) { errors.push(err.message); }
    }

    let msg = String(out.message || '').trim();
    if (!valid.length && !msg) msg = 'Je n’ai pas compris la demande. Reformule-la ?';
    if (errors.length) msg += (msg ? '\n\n' : '') + 'Certaines actions ont été ignorées : ' + errors.join(' ; ');
    aiMessages.push({ role: 'assistant', text: msg || 'Prêt.' });
    if (valid.length) aiPending = { actions: valid };
  } catch (err) {
    aiMessages.push({ role: 'assistant', text: 'Impossible de répondre : ' + err.message + '.' });
  } finally {
    aiBusy = false;
    const b = document.getElementById('ai-send');
    if (b) b.disabled = false;
    paintAI();
  }
}

/* ---------------- RENDU ---------------- */
function render() {
  document.querySelectorAll('.nav').forEach(n => n.classList.toggle('active', n.dataset.tab === currentTab));
  const low = S.filaments.filter(f => spoolLeftG(f) < 150).length;
  const b = document.getElementById('filBadge');
  if (low > 0) { b.style.display = ''; b.textContent = low; } else b.style.display = 'none';

  const map = { ai: viewAI, dash: viewDash, calc: viewCalc, fil: viewFil, prod: viewProd, shop: viewShop,
                sales: viewSales, stats: viewStats, settings: viewSettings, data: viewData };
  (map[currentTab] || viewDash)();
}
