<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrintProfit — Gestion & vente d'impressions 3D</title>
<style>
:root{
  --bg:#0b1017; --bg2:#111a24; --card:#151f2b; --card2:#1b2734;
  --line:#243244; --txt:#e8eef6; --muted:#8fa3b8;
  --acc:#3ddc97; --acc2:#38bdf8; --warn:#fbbf24; --bad:#f87171; --pink:#f472b6;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%,#16303f 0%,transparent 60%),var(--bg);
  color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2a3a4d;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:236px;flex-shrink:0;background:linear-gradient(180deg,#101a24,#0c141d);
  border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:6px;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.logo{
  width:38px;height:38px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:grid;place-items:center;font-weight:800;color:#062018;font-size:19px;
  box-shadow:0 6px 18px rgba(61,220,151,.28)
}
.brand h1{font-size:16px;font-weight:800;letter-spacing:-.2px;line-height:1.1}
.brand span{font-size:10.5px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.navlabel{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#5c7288;padding:14px 10px 6px;font-weight:700}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;
  color:var(--muted);font-size:13.5px;font-weight:600;transition:.16s;border:1px solid transparent;user-select:none}
.nav:hover{background:#182432;color:var(--txt)}
.nav.active{background:linear-gradient(90deg,rgba(61,220,151,.16),rgba(56,189,248,.06));
  color:var(--acc);border-color:rgba(61,220,151,.28)}
.nav .ic{font-size:15px;width:18px;text-align:center}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:10px;font-weight:800;
  padding:1px 6px;border-radius:20px}
.sidefoot{margin-top:auto;padding:14px 10px 0;font-size:11px;color:#54697e;line-height:1.5}

.main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1500px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
h2.page{font-size:23px;font-weight:800;letter-spacing:-.5px}
p.sub{color:var(--muted);font-size:13px;margin-top:4px}
.actions{display:flex;gap:9px;flex-wrap:wrap}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);
  background:var(--card2);color:var(--txt);font-size:13px;font-weight:650;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:#243447;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(135deg,var(--acc),#2fc48a);color:#052018;border:none;
  box-shadow:0 6px 18px rgba(61,220,151,.24)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.blue{background:linear-gradient(135deg,var(--acc2),#0ea5e9);color:#04202e;border:none}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:rgba(248,113,113,.3)}
.btn.danger:hover{background:rgba(248,113,113,.12)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.xs{padding:3px 8px;font-size:11px;border-radius:7px}

/* ---------- Cards ---------- */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{background:linear-gradient(180deg,var(--card),#131c27);border:1px solid var(--line);
  border-radius:15px;padding:16px 17px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;
  display:flex;align-items:center;gap:6px}
.kpi .val{font-size:26px;font-weight:800;margin-top:9px;letter-spacing:-1px}
.kpi .sub2{font-size:11.5px;color:var(--muted);margin-top:5px}
.pos{color:var(--acc)} .neg{color:var(--bad)} .warnc{color:var(--warn)} .bluec{color:var(--acc2)} .pinkc{color:var(--pink)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow)}
.panel h3{font-size:14px;font-weight:750;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.panel h3 .dot{width:7px;height:7px;border-radius:50%;background:var(--acc)}

/* ---------- Tables ---------- */
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card)}
th{text-align:left;padding:10px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--muted);background:#101a24;border-bottom:1px solid var(--line);font-weight:750;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid rgba(36,50,68,.6);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#18222f}
.num{font-variant-numeric:tabular-nums;text-align:right}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:13.5px}
.empty .big{font-size:34px;display:block;margin-bottom:10px;opacity:.55}

.swatch{width:13px;height:13px;border-radius:4px;display:inline-block;vertical-align:-2px;
  border:1px solid rgba(255,255,255,.22);margin-right:6px}
.pill{display:inline-block;padding:2.5px 9px;border-radius:20px;font-size:10.5px;font-weight:750;
  letter-spacing:.3px;background:#22303f;color:var(--muted);white-space:nowrap}
.pill.ok{background:rgba(61,220,151,.15);color:var(--acc)}
.pill.warn{background:rgba(251,191,36,.15);color:var(--warn)}
.pill.bad{background:rgba(248,113,113,.15);color:var(--bad)}
.pill.blue{background:rgba(56,189,248,.15);color:var(--acc2)}
.bar{height:6px;border-radius:5px;background:#22303f;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--acc),var(--acc2))}

/* ---------- Forms ---------- */
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:.3px}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:#0e1720;
  font-size:13px;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(61,220,151,.13)}
.field .hint{font-size:11px;color:#6b8098;margin-top:4px;line-height:1.4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
input[type=color]{padding:3px;height:38px;cursor:pointer;background:#0e1720}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(4,8,12,.72);backdrop-filter:blur(4px);
  display:none;place-items:center;z-index:100;padding:20px;overflow-y:auto}
.overlay.show{display:grid}
.modal{background:var(--card);border:1px solid var(--line);border-radius:17px;width:100%;
  max-width:600px;box-shadow:0 24px 70px rgba(0,0,0,.6);max-height:92vh;display:flex;flex-direction:column;
  animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
.modal header{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal header h3{font-size:15px;font-weight:800}
.modal .body{padding:20px;overflow-y:auto}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.x{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{background:#22303f;color:var(--txt)}

/* ---------- Compute box ---------- */
.calcbox{background:#0d1720;border:1px dashed rgba(61,220,151,.35);border-radius:12px;padding:13px 15px;margin:4px 0 8px}
.calcbox .line{display:flex;justify-content:space-between;font-size:12.5px;padding:3.5px 0;color:var(--muted)}
.calcbox .line b{color:var(--txt);font-variant-numeric:tabular-nums;font-weight:650}
.calcbox .line.total{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-size:14px;color:var(--txt);font-weight:750}
.calcbox .line.total b{color:var(--acc);font-size:17px}
.calcbox .line.price b{color:var(--acc2);font-size:17px}

/* ---------- Shop ---------- */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.pcard{background:linear-gradient(180deg,var(--card),#121b25);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;display:flex;flex-direction:column;transition:.18s}
.pcard:hover{transform:translateY(-3px);border-color:rgba(61,220,151,.4);box-shadow:0 14px 32px rgba(0,0,0,.45)}
.pthumb{height:104px;display:grid;place-items:center;font-size:40px;position:relative;
  background:linear-gradient(135deg,#1a2a38,#101a24)}
.pthumb .stk{position:absolute;top:8px;right:8px}
.pbody{padding:13px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.pbody h4{font-size:13.5px;font-weight:750;line-height:1.3}
.pbody .meta{font-size:11px;color:var(--muted);display:flex;gap:9px;flex-wrap:wrap}
.pbody .price{font-size:19px;font-weight:800;color:var(--acc);letter-spacing:-.5px}
.pbody .cost{font-size:10.5px;color:#6b8098}
.cartbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.cartlist{max-height:44vh;overflow-y:auto;margin:10px 0}

/* ---------- misc ---------- */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:var(--card2);
  font-size:12px;font-weight:650;cursor:pointer;color:var(--muted);transition:.15s;user-select:none}
.chip:hover{color:var(--txt)}
.chip.on{background:rgba(61,220,151,.15);border-color:var(--acc);color:var(--acc)}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:#0e1720;font-size:13px}
.toolbar input[type=search]{min-width:210px}
.two{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;align-items:start}
@media(max-width:1050px){.two{grid-template-columns:1fr}}
@media(max-width:820px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;gap:4px;padding:12px}
  .brand{width:100%;padding-bottom:8px}.navlabel{display:none}.sidefoot{display:none}
  .nav{padding:8px 11px;font-size:12.5px}
  .main{padding:16px 14px 50px}
  .row2,.row3{grid-template-columns:1fr}
}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);
  background:#16232f;border:1px solid var(--acc);color:var(--txt);padding:11px 20px;border-radius:11px;
  font-size:13px;font-weight:650;box-shadow:0 12px 34px rgba(0,0,0,.5);z-index:300;
  transition:.28s cubic-bezier(.2,.8,.3,1.2);opacity:0;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}
.split{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hr{height:1px;background:var(--line);margin:14px 0}
a.link{color:var(--acc2);text-decoration:none}
a.link:hover{text-decoration:underline}
.tip{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.25);border-radius:10px;
  padding:11px 13px;font-size:12px;color:#9fc4dd;line-height:1.5;margin-bottom:14px}
.tip b{color:#cfe6f5}
@media print{.sidebar,.actions,.btn{display:none!important}.main{padding:0}}

/* Nouvelle direction : atelier numérique, simple et plus lisible */
:root{--bg:#0c0e13;--bg2:#11141c;--card:#161a23;--card2:#202531;--line:#2b303c;--txt:#f3f2ee;--muted:#a0a4af;--acc:#c8f36d;--acc2:#aebcff;--shadow:0 12px 38px rgba(0,0,0,.18)}
body{background:radial-gradient(ellipse at 90% 0%,#25293b 0,transparent 42%),#0c0e13}
.sidebar{background:#111319;border-color:#292c35;padding:26px 16px}
.brand{padding-bottom:26px}.logo{background:#c8f36d;box-shadow:none;color:#1a2410;border-radius:13px}.brand h1{font-size:17px}.brand span{font-size:10px}
.nav{padding:11px 12px;border-radius:11px}.nav:hover{background:#20242e}.nav.active{background:#252e20;border-color:#38472b;color:#c8f36d}
.navlabel{letter-spacing:1.5px;color:#707683}.main{padding:42px 44px 70px}.page{font-size:30px!important;letter-spacing:-1px!important}.sub{font-size:14px!important}
.card,.panel{background:#171b24;border:1px solid #2b303b;box-shadow:none;border-radius:18px}.card{padding:20px}.kpi .val{font-size:30px}.panel{padding:22px}.btn{border-radius:11px}.btn.primary{background:#c8f36d;color:#1a2410;box-shadow:none}.btn.primary:hover{background:#dbff99}.tw{border-color:#303541}table{background:#171b24}th{background:#12161e}tbody tr:hover{background:#202530}
.ai-new{margin-left:auto;color:#c8f36d;font-size:9px;letter-spacing:.08em}.ai-header{margin:4px 0 32px}.ai-kicker{font-size:10px;color:#c8f36d;letter-spacing:.15em;font-weight:800}.ai-header h2{font-size:clamp(32px,4vw,52px);line-height:1.05;letter-spacing:-2px;margin:15px 0}.ai-header em{font-style:normal;color:#c8f36d}.ai-header p{color:#a0a4af;font-size:15px}.ai-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}.ai-panel,.ai-side,.ai-help{background:#171b24;border:1px solid #303440;border-radius:20px}.ai-panel{overflow:hidden}.ai-title{padding:20px 23px;border-bottom:1px solid #303440;display:flex;justify-content:space-between;align-items:center}.ai-title b{font-size:15px}.ai-title small{display:block;color:#9499a5;margin-top:5px}.ai-dot{font-size:10px;letter-spacing:.07em;color:#c8f36d}.ai-messages{height:350px;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}.ai-welcome{margin:auto;text-align:center;max-width:320px}.welcome-icon{display:grid;place-items:center;width:50px;height:50px;margin:0 auto 18px;border-radius:17px;background:#323e28;color:#c8f36d;font-size:25px}.ai-welcome h3{font-size:18px;margin-bottom:8px}.ai-welcome p,.ai-side p,.ai-help p{color:#9fa4b0;font-size:13px;line-height:1.6}.bubble{max-width:85%;border-radius:15px;padding:14px 16px;background:#252a35}.bubble.mine{align-self:flex-end;background:#343e28}.bubble span{font-size:9px;font-weight:800;color:#c8f36d;letter-spacing:.1em}.bubble p{margin-top:7px;line-height:1.55;font-size:14px;white-space:pre-wrap}.ai-form{margin:0 18px 8px;padding:9px;display:flex;gap:10px;background:#11141b;border:1px solid #383e49;border-radius:15px;align-items:end}.ai-form textarea{flex:1;resize:none;border:0;background:transparent;outline:0;padding:9px;color:#fff;min-width:0;font-size:13px}.ai-form button{padding:12px 16px}.ai-note{padding:0 23px 18px;color:#7f8694;font-size:11px}.ai-side{padding:22px}.ai-side-icon{font-size:24px;color:#c8f36d}.ai-side h3{font-size:20px;line-height:1.25;margin:16px 0 8px}.ai-side>b{display:block;margin:25px 0 9px;color:#838b98;font-size:9px;letter-spacing:.12em}.ai-side button{display:block;width:100%;text-align:left;padding:11px 0;border:0;border-bottom:1px solid #303440;background:none;color:#e2e4e7;cursor:pointer;font-size:12px}.ai-side button:hover{color:#c8f36d}.ai-help{margin-top:16px;padding:18px 22px;font-size:13px}.ai-help p{margin-top:6px}.ai-confirm{margin:0 18px 14px;padding:15px;border-radius:14px;background:#293322;border:1px solid #536739;font-size:13px}.ai-confirm pre{white-space:pre-wrap;font:inherit;line-height:1.5;margin:10px 0 14px;color:#e7f4d7}
@media(max-width:640px){.ai-tools{display:none}.ai-kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.ai-layout{grid-template-columns:1fr}.ai-layout aside{display:none}.main{padding:24px 20px 50px}.ai-messages{height:310px}}


/* ---------- Assistant IA v2 ---------- */
.ai-dot.down{color:#f0a35e}
.ai-tools{display:flex;gap:8px;align-items:center;margin-left:auto;margin-right:14px}
.ai-tools button{background:#11141b;border:1px solid #383e49;color:#9aa3b1;border-radius:9px;padding:5px 9px;font-size:11px;cursor:pointer}
.ai-tools button:hover{color:#c8f36d;border-color:#536739}
.ai-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;padding:0 18px;margin:14px 0 0}
.ai-kpi{background:#11141b;border:1px solid #303440;border-radius:11px;padding:8px 10px}
.ai-kpi b{display:block;font-size:15px;color:#c8f36d;line-height:1.25}
.ai-kpi span{font-size:9px;color:#8e95a3;letter-spacing:.08em;text-transform:uppercase}
.ai-chip{padding:6px 10px;border-radius:999px;border:1px solid #383e49;background:#11141b;color:#cfd6e2;font-size:11.5px;cursor:pointer}
.ai-chip:hover{border-color:#c8f36d;color:#c8f36d}
.ai-tries{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.ai-tries .ai-chip{font-size:11px;padding:5px 9px;background:#2c3625;border-color:#4d5c3a}
.ai-actions{display:flex;gap:7px;flex-wrap:wrap;padding:12px 18px 0}
.ai-insights{padding:12px 18px 0;font-size:12px;color:#cfd6e2}
.ai-insights b{display:block;font-size:10px;letter-spacing:.1em;color:#8e95a3;margin-bottom:6px}
.ai-insights li{padding-left:13px;position:relative;line-height:1.55;margin-bottom:4px}
.ai-insights li:before{content:'▸';position:absolute;left:0;color:#c8f36d}
.ai-prop-item{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed #3f4b30;font-size:12.5px}
.ai-prop-item span{flex:1;line-height:1.5}
.ai-prop-item button{background:none;border:0;color:#8d9a78;cursor:pointer;font-size:12px;padding:0 2px}
.ai-prop-item button:hover{color:#f0a35e}
.bubble p code{border-radius:4px}
.bubble.warn p{color:#ffd9b0}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">P</div>
      <div>
        <h1>PrintProfit</h1>
        <span>Atelier 3D</span>
      </div>
    </div>
    <div class="navlabel">Pilotage</div>
    <div class="nav" data-tab="ai"><span class="ic">✦</span> Assistant IA <span class="ai-new">NOUVEAU</span></div>
    <div class="nav active" data-tab="dash"><span class="ic">◈</span> Tableau de bord</div>
    <div class="nav" data-tab="calc"><span class="ic">∑</span> Simulateur</div>
    <div class="navlabel">Production</div>
    <div class="nav" data-tab="fil"><span class="ic">◍</span> Filaments <span class="badge" id="filBadge" style="display:none">0</span></div>
    <div class="nav" data-tab="prod"><span class="ic">▣</span> Objets & prix</div>
    <div class="nav" data-tab="shop"><span class="ic">◊</span> Boutique</div>
    <div class="navlabel">Commerce</div>
    <div class="nav" data-tab="sales"><span class="ic">₱</span> Ventes</div>
    <div class="nav" data-tab="stats"><span class="ic">◔</span> Rentabilité</div>
    <div class="navlabel">Système</div>
    <div class="nav" data-tab="settings"><span class="ic">⚙</span> Réglages</div>
    <div class="nav" data-tab="data"><span class="ic">⇅</span> Données</div>
    <div class="sidefoot">Données stockées<br>dans ce navigateur.</div>
  </aside>
  <main class="main" id="view"></main>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
/* =========================================================
   PrintProfit — moteur de gestion pour atelier d'impression 3D
   Tout est local (localStorage). Aucune donnée ne sort.
   ========================================================= */

const LS_KEY = 'printprofit_real_v2';

/* ---------------- Coût filament ---------------- */
// Prix au gramme d'un filament, basé sur la bobine
/* Estime le poids d'un objet à partir du seul temps d'impression.
   Attention : c'est une estimation. À temps égal, un objet plein (mode vase,
   100 % de remplissage, grosses pièces) pèse beaucoup plus qu'un objet creux.
   Le vrai poids reste celui affiché par le slicer. */
function debitFilament(f) {
  const st = S.settings || {};
  const parDefaut = Number(st.flowGPerHour) || 20;
  const perso = f && Number(f.flowGPerHour) > 0 ? Number(f.flowGPerHour) : null;
  return perso || parDefaut;
}

/* Débit massique théorique d'un hotend : mm3/s × masse volumique.
   PLA = 1,24 g/cm3 ; le filament 1,75 mm pèse 2,98 g/m. */
const MASSE_PLA_G_MM3 = 1.24 / 1000;
function debitTheoriqueGParHeure(mm3s) {
  return (Number(mm3s) || 0) * MASSE_PLA_G_MM3 * 3600;
}

/* Calibrage à partir d'objets déjà imprimés : moyenne pondérée poids/heures. */
function calibrerDebit(objets) {
  let grammes = 0, heures = 0;
  (objets || []).forEach(o => {
    const g = Number(o && o.poids) || 0;
    const h = Number(o && o.heures) || 0;
    if (g > 0 && h > 0) { grammes += g; heures += h; }
  });
  return heures > 0 ? grammes / heures : 0;
}

function estimatedWeightG(hours, filamentId) {
  const h = Number(hours) || 0;
  if (h <= 0) return 0;
  return h * debitFilament(getFilament(filamentId));
}

function filamentPricePerGram(f) {
  if (!f || !f.spoolWeight) return 0;
  return (f.spoolPrice || 0) / (f.spoolWeight || 1);
}
function getFilament(id) { return S.filaments.find(f => f.id === id) || null; }

// Poids restant sur la bobine (pour 1 bobine)
/* Reste disponible = bobines neuves + la bobine entamée.
   Une bobine entamée ne doit jamais être comptée en double : si le stock de
   bobines neuves est à 0, la bobine ouverte fait partie du « remaining ». */
function spoolLeftG(f) {
  if (!f) return 0;
  const neuves = Math.max(0, Number(f.stockSpools) || 0);
  const ouvertes = Math.min(Math.max(0, Number(f.remaining) || 0), Number(f.spoolWeight) || Infinity);
  return neuves * (Number(f.spoolWeight) || 0) + ouvertes;
}

/* ---------------- MOTEUR DE CALCUL ----------------
   Renvoie tous les coûts + prix conseillés pour un objet.
   --------------------------------------------------- */
function computeProduct(p, opts) {
  opts = opts || {};
  const st = S.settings;
  const fil = getFilament(p.filamentId);
  const qty = Math.max(1, Number(p.qtyPerPlate) || 1);

  // --- temps d'impression (par objet = temps plateau / nb objets) ---
  const plateHours = (Number(p.printHours) || 0) + (Number(p.printMin) || 0) / 60;
  const hoursPerObject = plateHours / qty;

  // --- matière ---
  // Sans poids saisi, on estime à partir du temps et du débit du filament.
  const gSaisi = Number(p.weightG) || 0;
  const gEstime = gSaisi > 0 ? 0 : estimatedWeightG(hoursPerObject, p.filamentId);
  const g = gSaisi > 0 ? gSaisi : gEstime;
  const poidsEstime = gSaisi <= 0 && gEstime > 0;
  const ppg = filamentPricePerGram(fil);
  const filamentCost = g * ppg;

  // perte liée aux ratés (% de la matière ET du temps machine)
  const failP = (Number(st.failRatePct) || 0) / 100;
  const filamentCostWithFail = filamentCost * (1 + failP);

  // --- énergie ---
  const kWh = (st.printerWatts / 1000) * hoursPerObject;
  const elecCost = kWh * st.elecPricePerKwh;
  const elecCostWithFail = elecCost * (1 + failP);

  // --- usure machine ---
  const machineCost = (st.printerPrice / Math.max(1, st.printerLifeHours)) * hoursPerObject;
  const maintCost = st.maintenancePerHour * hoursPerObject;
  const wearCost = machineCost + maintCost;

  // --- main d'œuvre (préparation + finition) ---
  // Ce n'est pas un débours : c'est ton temps. On l'isole pour pouvoir
  // présenter un « coût de revient » comparable à un calcul à la main.
  const postMin = Number(p.postMin ?? st.postProcessMin) || 0;
  const laborCost = (postMin / 60) * st.laborPerHour;

  // --- emballage ---
  const packaging = Number(p.packaging ?? st.packagingCost) || 0;

  // --- totales ---
  /* Base de coût : matière et électricité. L'usure machine, l'emballage et ton
     temps sont des postes optionnels, désactivés par défaut : ils ne pèsent
     donc pas sur le bénéfice tant que tu ne les actives pas. */
  const cashCost = filamentCostWithFail + elecCostWithFail
    + (st.includeWear ? wearCost : 0)
    + (st.includePackaging ? packaging : 0);
  const excludedCost = (st.includeWear ? 0 : wearCost) + (st.includePackaging ? 0 : packaging);
  /* Ton temps n'est pas une dépense : par défaut il ne pèse pas sur le coût
     (donc pas sur le bénéfice). Le réglage includeLabor permet de le compter
     si tu veux te rémunérer un temps fixe dans le prix. */
  const laborInCost = st.includeLabor ? laborCost : 0;
  const variable = cashCost + laborInCost;

  // marge multipliée demandée sur l'objet
  const mult = Number(p.multiplier) || 2.5;

  // Prix de vente hors frais : coût * coefficient
  let priceRaw = variable * mult;

  // Frais de vente (commission + paiement)
  const feePct = (Number(st.platformFeePct) + Number(st.paymentFeePct)) / 100;
  const feeFixed = Number(st.paymentFeeFixed) || 0;
  // prix pour que net = priceRaw
  let priceFees = (priceRaw + feeFixed) / (1 - feePct);

  // prix conseillé par marge cible : coût (temps valorisé inclus) / (1 - marge)
  const targetM = (Number(st.targetMarginPct) || 0) / 100;
  let priceMargin = (variable + feeFixed) / Math.max(0.05, (1 - targetM - feePct));

  // prix final affiché = override manuel sinon prix "frais + coefficient"
  const price = (p.priceOverride !== null && p.priceOverride !== undefined && p.priceOverride !== '' && Number(p.priceOverride) > 0)
    ? Number(p.priceOverride)
    : priceFees;

  // rétro-calcul des frais réels sur le prix
  const platformFee = price * (Number(st.platformFeePct) / 100);
  const paymentFee = price * (Number(st.paymentFeePct) / 100) + feeFixed;
  const totalFees = platformFee + paymentFee;

  const netRevenue = price - totalFees;               // ce que tu encaisses réellement
  const profit = netRevenue - variable;               // bénéfice avant TVA
  const marginPct = netRevenue > 0 ? (profit / netRevenue) * 100 : 0;
  const markupPct = variable > 0 ? (profit / variable) * 100 : 0;   // taux de gain sur coût
  const roi = variable > 0 ? (profit / variable) * 100 : 0;

  // TVA (si activée, le prix affiché est TTC)
  const vat = st.vatEnabled ? price - price / (1 + st.vatPct / 100) : 0;
  const netOfVat = st.vatEnabled ? price / (1 + st.vatPct / 100) : price;

  // temps & cadence
  const totalHours = hoursPerObject + postMin / 60;
  const perHour = totalHours > 0 ? profit / totalHours : 0;      // bénéfice/heure machine
  const perGramPrice = g > 0 ? price / g : 0;

  // prix psychologique (arrondi au ,90 / ,99)
  const psych = Math.round(price) - 0.1;

  return {
    qty, plateHours, hoursPerObject, totalHours,
    weight: g, weightEstimated: poidsEstime, weightDeclared: gSaisi,
    pricePerGram: ppg, filamentName: fil ? fil.name : '— (aucun filament)',
    filamentColor: fil ? fil.colorHex : '#555',
    costs: {
      filament: filamentCost, filamentWithFail: filamentCostWithFail, failWaste: filamentCostWithFail - filamentCost,
      kWh, elec: elecCost, elecWithFail: elecCostWithFail,
      machine: machineCost, maintenance: maintCost, wear: wearCost,
      labor: laborCost, postMin, packaging,
      cash: cashCost, excluded: excludedCost, variable
    },
    multiplier: mult,
    priceRaw, priceFees, priceMargin, price, psych,
    fees: { platform: platformFee, payment: paymentFee, total: totalFees },
    netRevenue, netOfVat, vat, profit, marginPct, markupPct, roi,
    perHour, perGramPrice,
    breakEven: variable + totalFees,          // prix minimum pour ne rien perdre
    maxFailAllowed: price > 0 ? ((netRevenue - (filamentCost + elecCost + wearCost + laborCost + packaging)) / Math.max(0.01, filamentCost + elecCost)) * 100 : 0
  };
}

/* Prix de vente d'une ligne de vente (utilise le prix réel enregistré) */
function saleProfit(sale) {
  const c = sale.costSnapshot || {};
  const unitCost = c.variable || 0;
  const qty = Number(sale.qty) || 1;
  const price = Number(sale.unitPrice) || 0;
  const st = S.settings;
  const gross = price * qty;
  const fees = gross * ((st.platformFeePct + st.paymentFeePct) / 100) + st.paymentFeeFixed;
  const shipCost = Number(sale.shippingCost ?? 0);
  const shipCharged = Number(sale.shipping ?? 0);
  const cost = unitCost * qty;
  const profit = gross + shipCharged - fees - cost - shipCost;
  return { gross, fees, cost, profit, margin: gross > 0 ? (profit / gross) * 100 : 0 };
}

// couleur lisible sur fond sombre (évite le noir sur noir)
function readableColor(hex) {
  const h = (hex || '#888888').replace('#', '');
  const n = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const r = parseInt(n.slice(0, 2), 16) || 0, g = parseInt(n.slice(2, 4), 16) || 0, b = parseInt(n.slice(4, 6), 16) || 0;
  const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  if (lum < 58) return '#93a7bb';
  return '#' + n.slice(0, 6);
}
function iconSvg(key, size, color) {

}

/* ---------------- Graphique (SVG pur, sans lib) ---------------- */
function lineChart(values, labels, w, h, color) {
  w = w || 620; h = h || 170;
  if (!values.length) return `<div class="empty">Pas encore de données</div>`;
  const pad = { l: 44, r: 12, t: 12, b: 22 };
  const max = Math.max(...values, 1) * 1.15, min = Math.min(...values, 0);
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const X = i => pad.l + (values.length === 1 ? iw / 2 : (i / (values.length - 1)) * iw);
  const Y = v => pad.t + ih - ((v - min) / (max - min || 1)) * ih;
  let path = '', area = '';
  values.forEach((v, i) => { path += (i ? ' L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); });
  area = path + ` L${X(values.length - 1).toFixed(1)} ${pad.t + ih} L${pad.l} ${pad.t + ih} Z`;
  let grid = '', ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const v = min + ((max - min) / ticks) * i, y = Y(v);
    grid += `<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${w - pad.r}" y2="${y.toFixed(1)}" stroke="#243244" stroke-width="1"/>
      <text x="${pad.l - 8}" y="${(y + 4).toFixed(1)}" fill="#6b8098" font-size="10" text-anchor="end">${Math.round(v)}</text>`;
  }
  let dots = '', lbls = '';
  values.forEach((v, i) => {
    dots += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.4" fill="${color || '#3ddc97'}" stroke="#151f2b" stroke-width="1.6"/>`;
    if (values.length <= 14 || i % Math.ceil(values.length / 10) === 0)
      lbls += `<text x="${X(i).toFixed(1)}" y="${h - 6}" fill="#6b8098" font-size="9.5" text-anchor="middle">${esc(labels[i] || '')}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;overflow:visible">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color || '#3ddc97'}" stop-opacity=".30"/>
      <stop offset="100%" stop-color="${color || '#3ddc97'}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#g1)"/>
    <path d="${path}" fill="none" stroke="${color || '#3ddc97'}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${lbls}</svg>`;
}

function donut(parts, size) {
  // parts = [{label,value,color}]
  const s = size || 150, R = s / 2 - 12, cx = s / 2, cy = s / 2;
  const total = parts.reduce((a, p) => a + p.value, 0) || 1;
  let a0 = -Math.PI / 2, out = '';
  parts.forEach(p => {
    const a1 = a0 + (p.value / total) * Math.PI * 2;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0);
    const x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    out += `<path d="M${cx} ${cy} L${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z"
      fill="${p.color}" opacity=".9"/>`;
    a0 = a1;
  });
  out += `<circle cx="${cx}" cy="${cy}" r="${R * 0.58}" fill="#151f2b"/>`;
  return `<svg viewBox="0 0 ${s} ${s}" style="width:${s}px;height:${s}px">${out}</svg>`;
}

/* ---------------- Agrégats ---------------- */
function stats() {
  const now = new Date();
  const month = now.getMonth(), year = now.getFullYear();
  let revenue = 0, profit = 0, cost = 0, count = 0, shipped = 0;
  let mRevenue = 0, mProfit = 0, mCount = 0;
  const byMonth = {}, byProduct = {}, byChannel = {};
  S.sales.forEach(s => {
    const r = saleProfit(s);
    revenue += r.gross; profit += r.profit; cost += r.cost; count++;
    shipped += Number(s.shippingCost || 0);
    byChannel[s.channel || 'Direct'] = (byChannel[s.channel || 'Direct'] || 0) + r.profit;
    const d = new Date(s.date + 'T12:00:00');
    const key = isNaN(d) ? '?' : `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    byMonth[key] = byMonth[key] || { rev: 0, profit: 0, n: 0 };
    byMonth[key].rev += r.gross; byMonth[key].profit += r.profit; byMonth[key].n++;
    if (!isNaN(d) && d.getMonth() === month && d.getFullYear() === year) { mRevenue += r.gross; mProfit += r.profit; mCount++; }
    const k = s.productName || '—';
    byProduct[k] = byProduct[k] || { rev: 0, profit: 0, n: 0 };
    byProduct[k].rev += r.gross; byProduct[k].profit += r.profit; byProduct[k].n += Number(s.qty) || 1;
  });
  const hoursPrinted = S.products.reduce((a, p) => {
    const c = computeProduct(p);
    return a + c.totalHours * (S.sales.filter(s => s.productId === p.id).reduce((b, s) => b + (Number(s.qty) || 1), 0));
  }, 0);
  return { revenue, profit, cost, count, mRevenue, mProfit, mCount, byMonth, byProduct, byChannel, shipped, hoursPrinted,
           marginPct: revenue > 0 ? (profit / revenue) * 100 : 0 };
}

/* ---------- Saisie sans perte de focus ----------
   Un re-render complet du DOM à chaque frappe fait perdre le curseur.
   Ces helpers mettent à jour l'état, puis seulement les zones calculées. */
function simSet(key, value) {
  if (key === 'qty') simState.qty = Math.max(1, +value || 1);
  else if (key === 'mult') simState.mult = Math.max(1, +value || 1);
  else if (key === 'filamentId') simState.filamentId = value || null;
  else if (key === 'weight') simState.weight = value === '' ? null : Math.max(0, +value || 0);
  else simState[key] = +value || 0;
  viewCalc();
}

function _filterHandler(varName, applyFn) {
  return function () {
    window[varName].q = this.value;
    if (typeof window[applyFn] === 'function') window[applyFn]();
  };
}

            ${PRESET_COLORS.map(c => `<span class="chip" role="button" title="${c}" aria-label="Couleur ${c}" style="width:22px;height:22px;padding:0;background:${c};border-color:#2b3a4d;cursor:pointer" onclick="setFilColor('${c}')"></span>`).join('')}

      </div>
      <div class="row2">
        <div class="field"><label>Poids de la bobine (g) *</label>
          <input type="number" id="f_sw" value="${f.spoolWeight}" step="50" min="1"></div>
        <div class="field"><label>Prix de la bobine (${C()}) *</label>
          <input type="number" id="f_sp" value="${f.spoolPrice}" step="0.1" min="0"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Bobines en stock</label>
          <input type="number" id="f_stock" value="${f.stockSpools ?? 1}" step="1" min="0">
          <div class="hint">Bobines neuves non ouvertes</div></div>
        <div class="field"><label>Restant sur bobine ouverte (g)</label>
          <input type="number" id="f_rem" value="${f.remaining ?? 0}" step="10" min="0">
          <div class="hint">Poids réel estimé de la bobine entamée</div></div>
      </div>
      <div class="field"><label>Débit matière de ce filament (g/h)</label>
        <input type="number" id="f_flow" value="${f.flowGPerHour ?? ''}" step="0.5" min="0" placeholder="${S.settings.flowGPerHour}">
        <div class="hint">Facultatif. Vide = débit général. Certaines matières coulent plus vite (PETG, bois).</div></div>
      <div style="display:none">
      </div>
      <div class="field"><label>Note</label><input id="f_note" value="${esc(f.note || '')}" placeholder="Température, réglages, lot…"></div>
      <div class="calcbox" id="filPreview"></div>
    </div>
    <footer>
      <button class="btn ghost" onclick="closeModal()">Annuler</button>
      <button class="btn primary" onclick="saveFil('${id || ''}')">${id ? 'Enregistrer' : 'Ajouter'}</button>
    </footer>`);
  const upd = () => {
    const sw = +document.getElementById('f_sw').value || 1;
    const sp = +document.getElementById('f_sp').value || 0;
    const hex = document.getElementById('f_colorhex');
    /* le sélecteur natif pilote le texte, le texte pilote le sélecteur */
    const picker = document.getElementById('f_color');
    if (/^#[0-9a-f]{6}$/i.test(hex.value) && hex.value.toLowerCase() !== picker.value.toLowerCase()) {
      picker.value = hex.value.toLowerCase();
    }
    const pg = sp / sw;
    document.getElementById('filPreview').innerHTML = `
      <div class="line"><span>Prix au gramme</span><b>${money(pg, 3)}/g</b></div>
      <div class="line"><span>Prix au kilo</span><b>${money(pg * 1000)}/kg</b></div>
      <div class="line total"><span>Coût matière d'un objet de 50 g</span><b>${money(pg * 50)}</b></div>`;
  };
  ['f_sw', 'f_sp', 'f_colorhex'].forEach(i => document.getElementById(i).addEventListener('input', upd));
  document.getElementById('f_color').addEventListener('input', () => {
    document.getElementById('f_colorhex').value = document.getElementById('f_color').value;
    upd();
  });
  upd();
}

function setFilColor(hex) {
  document.getElementById('f_color').value = hex;
  document.getElementById('f_colorhex').value = hex;
  document.getElementById('f_color').dispatchEvent(new Event('input'));
}

function saveFil(id) {
  const g = i => document.getElementById(i).value;
  const name = g('f_name').trim();
  if (!name) return toast('⚠️ Donne un nom au filament');
  const hexRaw = (g('f_colorhex') || g('f_color') || '').trim();
  const colorHex = /^#[0-9a-f]{6}$/i.test(hexRaw) ? hexRaw.toLowerCase() : g('f_color');
  const data = {
    name, material: g('f_mat'), brand: g('f_brand').trim(),
    colorHex, spoolWeight: +g('f_sw') || 1000, spoolPrice: +g('f_sp') || 0,
    stockSpools: +g('f_stock') || 0, remaining: +g('f_rem') || 0, note: g('f_note'),
    flowGPerHour: g('f_flow') === '' ? null : +g('f_flow') || null
  };
  if (id) Object.assign(S.filaments.find(f => f.id === id), data);
  else S.filaments.push({ id: uid(), ...data });
  save(); closeModal(); render(); toast(id ? 'Filament mis à jour' : 'Filament ajouté ✓');
}

function quickSpool(id) {
  const f = S.filaments.find(x => x.id === id);
  f.stockSpools = (f.stockSpools || 0) + 1;
  save(); render(); toast(`＋1 bobine de ${f.name}`);
}

function delFil(id) {
  const used = S.products.filter(p => p.filamentId === id);
  if (used.length) return toast('⚠️ Utilisé par ' + used.length + ' objet(s) — modifie-les d\'abord');
  if (!confirm('Supprimer ce filament ?')) return;
  S.filaments = S.filaments.filter(f => f.id !== id);
  save(); render(); toast('Filament supprimé');
}

  const avgPrice = rows.length ? rows.reduce((a, r) => a + r.c.price, 0) / rows.length : 0;

function readProductForm() {
  const g = i => document.getElementById(i).value;
  const p = {
    name: g('p_name').trim(), sku: g('p_sku'), description: g('p_desc'),
    filamentId: g('p_fil'), weightG: g('p_w') === '' ? null : +g('p_w') || 0,
    printHours: +g('p_h') || 0, printMin: +g('p_m') || 0,
    qtyPerPlate: Math.max(1, +g('p_q') || 1),
    postMin: g('p_post') === '' ? null : +g('p_post') || 0,
    packaging: g('p_pack') === '' ? null : +g('p_pack') || 0,
    multiplier: +g('p_mult') || 2.5,
    priceOverride: g('p_over') === '' ? null : +g('p_over') || 0,
    stock: +g('p_stock') || 0,
    emoji: g('p_emoji') || 'cube',
    active: document.getElementById('p_active').checked
  };
  return p;
}
/* Le nom saisi est reporté sur la fiche en mémoire, pour que le titre de la
   fiche et le catalogue restent cohérents sans re-calculer les prix. */
function syncOverlayProductName() {
  const el = document.getElementById('p_name');
  const p = S.products.find(x => x.id === overlayProdId);
  if (el && p) p.name = el.value;
}

let overlayProdId = null;

function prodLive(id) {
  const p = readProductForm();
  document.getElementById('prodPreview').innerHTML = prodPreviewHTML(computeProduct(p));
}
function saveProduct(id) {
  const data = readProductForm();
  if (!data.name) return toast('⚠️ Donne un nom à l\'objet');
  Object.assign(S.products.find(x => x.id === id), data);
  save(); closeModal(); render(); toast('Objet enregistré ✓');
}
function delProduct(id) {
  const sold = S.sales.some(s => s.productId === id);
  if (sold && !confirm('Des ventes existent pour cet objet. Le supprimer quand même ? (les ventes seront conservées)')) return;
  if (!sold && !confirm('Supprimer cet objet ?')) return;
  S.products = S.products.filter(p => p.id !== id);
  save(); render(); toast('Objet supprimé');
}

            <div class="cost">revient ${money(c.costs.cash)} · marge ${pct(c.marginPct, 0)}</div>
          </div>
          <button class="btn primary sm" onclick="addCart('${p.id}')">＋</button>
        </div>
      </div>
    </div>`).join('')}</div>`
    : `<div class="panel empty"><span class="big">◊</span>La boutique est vide.<br>
       <button class="btn primary" style="margin-top:14px" onclick="go('prod')">Gérer mon catalogue</button></div>`}`;
}

function addCart(id) {
  const it = cart.find(i => i.id === id);
  if (it) it.qty++;
  else cart.push({ id, qty: 1 });
  toast('Ajouté au panier');
  render();
}

function openCart() {
  const lines = cart.map(i => {
    const p = S.products.find(x => x.id === i.id);
    return p ? { p, c: computeProduct(p), qty: i.qty } : null;
  }).filter(Boolean);
  const subtotal = lines.reduce((a, l) => a + l.c.price * l.qty, 0);
  const ship = subtotal > 0 ? S.settings.shippingCost : 0;
  const total = subtotal + ship;
  const profit = lines.reduce((a, l) => a + l.c.profit * l.qty, 0) - ship * 0;
  openModal(`
    <header><h3>Panier</h3><button class="x" onclick="closeModal()">✕</button></header>
    <div class="body">
      ${lines.length ? `<div class="cartlist"><div class="tw"><table>
        <thead><tr><th>Objet</th><th class="num">Qté</th><th class="num">Total</th><th></th></tr></thead>
        <tbody>${lines.map(l => `<tr>
          <td>${iconSvg(l.p.emoji, 15)} <b>${esc(l.p.name)}</b><div style="font-size:10.5px;color:#6b8098">${money(l.c.price)} / u.</div></td>
          <td class="num" style="white-space:nowrap">
            <button class="btn xs" onclick="cartQty('${l.p.id}',-1)">−</button>
            <b style="display:inline-block;min-width:22px;text-align:center">${l.qty}</b>
            <button class="btn xs" onclick="cartQty('${l.p.id}',1)">＋</button></td>
          <td class="num"><b>${money(l.c.price * l.qty)}</b></td>
          <td><button class="btn xs danger" onclick="cartQty('${l.p.id}',-999)">✕</button></td></tr>`).join('')}
        </tbody></table></div></div>
        <div class="calcbox">
          <div class="line"><span>Sous-total</span><b>${money(subtotal)}</b></div>
          <div class="line"><span>Livraison</span><b>${money(ship)}</b></div>
          <div class="line total"><span>Total</span><b>${money(total)}</b></div>
          <div class="line"><span>Bénéfice estimé</span><b class="pos">${money(profit)}</b></div>
        </div>
        <div class="field" style="margin-top:12px"><label>Nom du client</label><input id="cart_client" placeholder="ex : Marie D."></div>
        <div class="row2">
          <div class="field"><label>Canal de vente</label>
            <select id="cart_chan"><option>Direct</option><option>Etsy</option><option>Vinted</option><option>Marketplace</option><option>Instagram</option><option>Boutique</option><option>Autre</option></select></div>
          <div class="field"><label>Statut</label>
            <select id="cart_status"><option>À imprimer</option><option>En cours</option><option>Expédié</option><option>Livré</option></select></div>
        </div>`
      : `<div class="empty"><span class="big">${iconSvg('cart',40,'#6b8098')}</span>Ton panier est vide.</div>`}
    </div>
    <footer>
      ${lines.length ? `<button class="btn ghost" onclick="cart=[];render();closeModal()">Vider</button>
        <button class="btn primary" onclick="checkout()">✓ Valider la vente</button>` : `<button class="btn" onclick="closeModal()">Fermer</button>`}
    </footer>`);
}
function cartQty(id, d) {
  const it = cart.find(i => i.id === id);
  if (!it) return;
  it.qty += d;
  if (it.qty <= 0) cart = cart.filter(i => i.id !== id);
  openCart();
}
function checkout() {
  const client = (document.getElementById('cart_client').value || '').trim() || 'Client';
  const channel = document.getElementById('cart_chan').value;
  const status = document.getElementById('cart_status').value;
  const date = todayISO();
  cart.forEach(i => {
    const p = S.products.find(x => x.id === i.id);
    if (!p) return;
    const c = computeProduct(p);
    S.sales.push({
      id: uid(), date, productId: p.id, productName: p.name, qty: i.qty,
      unitPrice: +c.price.toFixed(2), shipping: S.settings.shippingCost, shippingCost: S.settings.shippingCost * 0.6,
      customer: client, channel, status, note: '',
      costSnapshot: { variable: c.costs.variable, filament: c.costs.filament, elec: c.costs.elecWithFail, wear: c.costs.wear, labor: c.costs.labor, packaging: c.costs.packaging }
    });
    if (p.stock > 0) p.stock = Math.max(0, p.stock - i.qty);
  });
  cart = []; save(); closeModal(); render(); toast('Vente enregistrée ✓');
}

/* ---------------- VENTES ---------------- */
let salesFilter = { q: '', chan: '', status: '' };

function salesListFiltered() {
  let list = S.sales.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  if (salesFilter.q) {
    const q = salesFilter.q.toLowerCase();
    list = list.filter(s => ((s.productName || '') + ' ' + (s.customer || '') + ' ' + (s.note || '')).toLowerCase().includes(q));
  }
  if (salesFilter.chan) list = list.filter(s => (s.channel || 'Direct') === salesFilter.chan);
  if (salesFilter.status) list = list.filter(s => s.status === salesFilter.status);
  return list;
}

  if (count) count.textContent = list.length + ' ligne' + (list.length > 1 ? 's' : '');
  if (!list.length) {
    return `<div class="panel empty"><span class="big">₱</span>Aucune vente ici.<br>
      <button class="btn primary" style="margin-top:14px" onclick="viewSaleNew()">＋ Enregistrer une vente</button></div>`;
  }
  return `<div class="tw"><table>
    <thead><tr><th>Date</th><th>Objet</th><th>Client</th><th>Canal</th><th class="num">Qté</th><th class="num">P.U.</th>
      <th class="num">Total</th><th class="num">Coût</th><th class="num">Bénéfice</th><th class="num">Marge</th><th>Statut</th><th></th></tr></thead>
    <tbody>${list.map(s => { const r = saleProfit(s); return `<tr>
      <td style="white-space:nowrap">${frDate(s.date)}</td>
      <td><b>${esc(s.productName)}</b></td>
      <td>${esc(s.customer || '—')}</td>
      <td><span class="pill">${esc(s.channel || 'Direct')}</span></td>
      <td class="num">${s.qty}</td>
      <td class="num">${money(s.unitPrice)}</td>
      <td class="num"><b>${money(r.gross)}</b></td>
      <td class="num" style="color:var(--muted)">${money(r.cost)}</td>
      <td class="num ${r.profit >= 0 ? 'pos' : 'neg'}"><b>${money(r.profit)}</b></td>
      <td class="num"><span class="pill ${r.margin >= 50 ? 'ok' : r.margin >= 20 ? 'warn' : 'bad'}">${pct(r.margin, 0)}</span></td>
      <td><select style="padding:3px 6px;border-radius:6px;background:#0e1720;border:1px solid var(--line);font-size:11px"
        onchange="setStatus('${s.id}',this.value)">
        ${['À imprimer', 'En cours', 'Expédié', 'Livré', 'Annulé'].map(x => `<option ${s.status === x ? 'selected' : ''}>${x}</option>`).join('')}
      </select></td>
      <td style="white-space:nowrap"><button class="btn xs danger" onclick="delSale('${s.id}')">✕</button></td>
    </tr>`; }).join('')}</tbody></table></div>`;
}

function viewSales() {
  const all = S.sales.map(saleProfit);

  document.getElementById('view').innerHTML = `

  <div class="grid kpis" style="margin-bottom:16px">
    <div class="card kpi"><div class="lbl">Chiffre d'affaires</div><div class="val">${money(totRev)}</div><div class="sub2">${S.sales.length} vente${S.sales.length > 1 ? 's' : ''}</div></div>
    <div class="card kpi"><div class="lbl">Bénéfice net</div><div class="val ${totProf >= 0 ? 'pos' : 'neg'}">${money(totProf)}</div><div class="sub2">après frais & coûts</div></div>

function setStatus(id, v) {
  const s = S.sales.find(x => x.id === id);
  if (s) { s.status = v; save(); render(); }
}
function delSale(id) {
  if (!confirm('Supprimer cette vente ?')) return;
  S.sales = S.sales.filter(s => s.id !== id);
  save(); render(); toast('Vente supprimée');
}
function sellProduct(id) { viewSaleNew(id); }

function viewSaleNew(preselect) {
  const prods = S.products;
  if (!prods.length) return toast('⚠️ Crée d\'abord un objet dans le catalogue');
  const firstId = preselect || prods[0].id;
  const c0 = computeProduct(prods.find(p => p.id === firstId));
  openModal(`
    <header><h3>Nouvelle vente</h3><button class="x" onclick="closeModal()">✕</button></header>
    <div class="body">
      <div class="field"><label>Objet</label>
        <select id="s_prod" oninput="saleLive()">
          ${prods.map(p => `<option value="${p.id}" ${p.id === firstId ? 'selected' : ''}>${esc(p.name)} — ${money(computeProduct(p).price)}</option>`).join('')}
        </select></div>
      <div class="row3">
        <div class="field"><label>Quantité</label><input type="number" id="s_qty" value="1" min="1" step="1" oninput="saleLive()"></div>
        <div class="field"><label>Prix unitaire (${C()})</label><input type="number" id="s_price" value="${c0.price.toFixed(2)}" step="0.5" min="0" oninput="saleLive()"></div>
        <div class="field"><label>Date</label><input type="date" id="s_date" value="${todayISO()}"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Client</label><input id="s_client" placeholder="ex : Marie D."></div>
        <div class="field"><label>Canal</label>
          <select id="s_chan">${['Direct', 'Etsy', 'Vinted', 'Marketplace', 'Instagram', 'Boutique', 'Salon', 'Autre'].map(x => `<option>${x}</option>`).join('')}</select></div>
      </div>
      <div class="row3">
        <div class="field"><label>Livraison facturée</label><input type="number" id="s_ship" value="${S.settings.shippingCost}" step="0.5" min="0" oninput="saleLive()"></div>
        <div class="field"><label>Coût réel port</label><input type="number" id="s_shipcost" value="${(S.settings.shippingCost * 0.6).toFixed(2)}" step="0.5" min="0" oninput="saleLive()"></div>
        <div class="field"><label>Statut</label>
          <select id="s_status">${['Livré', 'Expédié', 'En cours', 'À imprimer'].map(x => `<option>${x}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>Note</label><input id="s_note" placeholder="couleur demandée, personnalisation…"></div>
      <div class="calcbox" id="salePreview"></div>

    </footer>`);

}
function salePreviewHTML(c) {
  const q = Math.max(1, +document.getElementById('s_qty')?.value || 1);
  const price = +document.getElementById('s_price')?.value || 0;
  const ship = +document.getElementById('s_ship')?.value || 0;
  const shipCost = +document.getElementById('s_shipcost')?.value || 0;
  const st = S.settings;
  const gross = price * q + ship;
  const fees = (price * q) * ((st.platformFeePct + st.paymentFeePct) / 100) + st.paymentFeeFixed;
  const cost = c.costs.variable * q + shipCost;
  const profit = gross - fees - cost;
  return `
    <div class="line"><span>Encaissé (produits + port)</span><b>${money(gross)}</b></div>
    <div class="line"><span>Frais plateforme + paiement</span><b>−${money(fees)}</b></div>
    <div class="line"><span>Coût de revient (${q} × ${money(c.costs.variable)})</span><b>−${money(cost)}</b></div>
    <div class="line total"><span>Bénéfice net</span><b class="${profit >= 0 ? 'pos' : 'neg'}">${money(profit)}</b></div>
    <div class="line"><span>Marge nette</span><b>${pct(gross > 0 ? profit / gross * 100 : 0)}</b></div>`;
}
let lastSalePid = null;
function saleLive(force) {
  const pidEl = document.getElementById('s_prod');
  if (!pidEl) return;
  const pid = pidEl.value;
  const p = S.products.find(x => x.id === pid);
  if (!p) return;
  const c = computeProduct(p);
  const priceEl = document.getElementById('s_price');
  if (force || pid !== lastSalePid) { priceEl.value = c.price.toFixed(2); lastSalePid = pid; }
  const pv = document.getElementById('salePreview');
  if (pv) pv.innerHTML = salePreviewHTML(c);
}
function saveSale() {
  const pid = document.getElementById('s_prod').value;
  const p = S.products.find(x => x.id === pid);
  if (!p) return toast('⚠️ Objet introuvable');
  const c = computeProduct(p);
  const qty = Math.max(1, +document.getElementById('s_qty').value || 1);
  S.sales.push({
    id: uid(), date: document.getElementById('s_date').value || todayISO(),
    productId: p.id, productName: p.name, qty,
    unitPrice: +document.getElementById('s_price').value || 0,
    shipping: +document.getElementById('s_ship').value || 0,
    shippingCost: +document.getElementById('s_shipcost').value || 0,
    customer: document.getElementById('s_client').value.trim(),
    channel: document.getElementById('s_chan').value,
    status: document.getElementById('s_status').value,
    note: document.getElementById('s_note').value,
    costSnapshot: { variable: c.costs.variable, filament: c.costs.filament, elec: c.costs.elecWithFail, wear: c.costs.wear, labor: c.costs.labor, packaging: c.costs.packaging }
  });
  if (p.stock > 0) p.stock = Math.max(0, p.stock - qty);
  save(); closeModal(); render(); toast('Vente enregistrée ✓');
}

/* ---------------- RENTABILITÉ ---------------- */
function viewStats() {
  const st = stats();
  const keys = Object.keys(st.byMonth).sort();
  const labels = keys.map(k => { const [y, m] = k.split('-'); return `${m}/${y.slice(2)}`; });
  const profSeries = keys.map(k => Math.round(st.byMonth[k].profit));
  const revSeries = keys.map(k => Math.round(st.byMonth[k].rev));

  // structure de coût moyenne du catalogue
  const cs = S.products.map(p => computeProduct(p).costs);
  const sum = k => cs.reduce((a, c) => a + (c[k] || 0), 0);
  const parts = [
    { label: 'Matière', value: sum('filamentWithFail'), color: '#3ddc97' },
    { label: 'Électricité', value: sum('elecWithFail'), color: '#fbbf24' },
    { label: 'Usure machine', value: sum('wear'), color: '#38bdf8' },
    { label: 'Main d\'œuvre', value: sum('labor'), color: '#f472b6' },
    { label: 'Emballage', value: sum('packaging'), color: '#a78bfa' }
  ];
  const totalParts = parts.reduce((a, p) => a + p.value, 0) || 1;

  const bestMonth = keys.reduce((best, k) => (!best || st.byMonth[k].profit > st.byMonth[best].profit ? k : best), null);
  const top = Object.entries(st.byProduct).sort((a, b) => b[1].profit - a[1].profit);
  const hoursSold = st.hoursPrinted || 0;
  const profitPerHour = hoursSold > 0 ? st.profit / hoursSold : 0;

  // projection : si tu vends X objets / mois
  const avgProfitUnit = S.sales.length ? st.profit / S.sales.reduce((a, s) => a + (Number(s.qty) || 1), 0) : 0;

  document.getElementById('view').innerHTML = `
  <div class="topbar"><div>
    <h2 class="page">Rentabilité</h2>
    <p class="sub">Où part ton argent, ce qui rapporte vraiment, et combien tu gagnes par heure.</p>
  </div><div class="actions"><button class="btn" onclick="window.print()">Imprimer</button></div></div>

  <div class="grid kpis" style="margin-bottom:16px">
    <div class="card kpi"><div class="lbl">Bénéfice / heure imprimée</div><div class="val pinkc">${money(profitPerHour)}</div><div class="sub2">${num(hoursSold, 1)} h vendues au total</div></div>
    <div class="card kpi"><div class="lbl">Marge nette globale</div><div class="val ${st.marginPct >= 30 ? 'pos' : 'warnc'}">${pct(st.marginPct)}</div><div class="sub2">sur ${money(st.revenue)} encaissés</div></div>
    <div class="card kpi"><div class="lbl">Bénéfice moyen / unité</div><div class="val pos">${money(avgProfitUnit)}</div><div class="sub2">toutes ventes confondues</div></div>
    <div class="card kpi"><div class="lbl">Meilleur mois</div><div class="val bluec">${bestMonth ? labels[keys.indexOf(bestMonth)] : '—'}</div>
      <div class="sub2">${bestMonth ? money(st.byMonth[bestMonth].profit) + ' de bénéfice' : 'pas encore de données'}</div></div>
  </div>

  <div class="two">
    <div class="panel">
      <h3><span class="dot"></span> Bénéfice mois par mois</h3>
      ${keys.length ? lineChart(profSeries, labels, 620, 190, '#3ddc97') : `<div class="empty"><span class="big">◔</span>Enregistre des ventes pour voir ta progression.</div>`}
      <div class="hr"></div>
      <h3><span class="dot" style="background:#38bdf8"></span> Chiffre d'affaires</h3>
      ${keys.length ? lineChart(revSeries, labels, 620, 150, '#38bdf8') : ''}
    </div>

    <div class="panel">
      <h3><span class="dot" style="background:#fbbf24"></span> Structure de tes coûts</h3>
      <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
        ${donut(parts, 150)}
        <div style="flex:1;min-width:150px">
          ${parts.map(p => `<div class="split" style="font-size:12.5px;padding:4px 0">
            <span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${p.color};margin-right:7px"></i>${p.label}</span>
            <b>${pct((p.value / totalParts) * 100, 0)}</b></div>`).join('')}
        </div>
      </div>
      <div class="hr"></div>
      <h3 style="margin-bottom:8px"><span class="dot" style="background:#f472b6"></span> Par canal de vente</h3>
      ${Object.keys(st.byChannel).length ? Object.entries(st.byChannel).sort((a, b) => b[1] - a[1]).map(([ch, v]) => {
        const max = Math.max(...Object.values(st.byChannel), 1);
        return `<div style="margin-bottom:9px"><div class="split" style="font-size:12px"><span>${esc(ch)}</span><b class="${v >= 0 ? 'pos' : 'neg'}">${money(v)}</b></div>
          <div class="bar"><i style="width:${Math.max(3, v / max * 100).toFixed(0)}%"></i></div></div>`;
      }).join('') : '<div style="font-size:12px;color:var(--muted)">Aucune donnée</div>'}
    </div>
  </div>

  <div class="panel" style="margin-top:14px">
    <h3><span class="dot"></span> Classement des objets</h3>
    ${top.length ? `<div class="tw"><table>
      <thead><tr><th>#</th><th>Objet</th><th class="num">Unités</th><th class="num">CA</th><th class="num">Bénéfice</th><th class="num">Part du bénéfice</th></tr></thead>
      <tbody>${top.map(([name, v], i) => `<tr>
        <td style="color:var(--muted)">${i + 1}</td><td><b>${esc(name)}</b></td>
        <td class="num">${v.n}</td><td class="num">${money(v.rev)}</td>
        <td class="num pos"><b>${money(v.profit)}</b></td>
        <td class="num">${pct(st.profit > 0 ? v.profit / st.profit * 100 : 0, 0)}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="empty">Pas encore de ventes.</div>`}
  </div>

  <div class="panel" style="margin-top:14px">
    <h3><span class="dot" style="background:#38bdf8"></span> Projection rapide</h3>
    <div class="toolbar" style="margin-bottom:10px">
      <label style="font-size:12.5px;color:var(--muted)">Si je vends</label>
      <input type="number" id="proj_n" value="20" min="0" style="width:90px" oninput="projCalc(${avgProfitUnit})">
      <label style="font-size:12.5px;color:var(--muted)">objets / mois</label>
    </div>
    <div class="calcbox" id="projOut"></div>
    <div style="font-size:11.5px;color:#6b8098;margin-top:8px">Basé sur ton bénéfice moyen par unité (${money(avgProfitUnit)}).</div>
  </div>`;
  projCalc(avgProfitUnit);
}
function projCalc(avg) {
  const n = +document.getElementById('proj_n').value || 0;
  const m = n * avg;
  document.getElementById('projOut').innerHTML = `

/* Calibrage : trois objets dont on connaît poids et durée réels. */
function openCalibrageDebit() {
  const st = S.settings;
  const exemples = S.products.filter(p => Number(p.weightG) > 0 && (Number(p.printHours) || 0) + (Number(p.printMin) || 0) > 0).slice(0, 3);
  const ligne = (i, nom, poids, heures) => `
    <div class="row3" style="margin-bottom:8px">
      <div class="field"><label>Objet ${i + 1}</label><input id="cal_n${i}" value="${esc(nom || '')}" placeholder="ex : pot de fleurs"></div>
      <div class="field"><label>Poids réel (g)</label><input type="number" id="cal_g${i}" value="${poids || ''}" step="1" min="0" placeholder="poids pesé"></div>
      <div class="field"><label>Durée réelle (h)</label><input type="number" id="cal_h${i}" value="${heures || ''}" step="0.05" min="0" placeholder="ex : 6.75"></div>
    </div>`;
  openModal(`
    <header><h3>Calibrer mon débit</h3><button class="x" onclick="closeModal()">✕</button></header>
    <div class="body">
      <div class="tip">Prends <b>trois objets que tu as déjà imprimés</b>, pèse-les et note la durée affichée par l'imprimante.
        Le rapport poids ÷ durée donne ton débit réel. Trois objets valent mieux qu'un : les petits détails faussent une mesure isolée.</div>
      ${ligne(0, exemples[0] && exemples[0].name, exemples[0] && exemples[0].weightG, exemples[0] ? (exemples[0].printHours || 0) + (exemples[0].printMin || 0) / 60 : null)}
      ${ligne(1, exemples[1] && exemples[1].name, exemples[1] && exemples[1].weightG, exemples[1] ? (exemples[1].printHours || 0) + (exemples[1].printMin || 0) / 60 : null)}
      ${ligne(2, exemples[2] && exemples[2].name, exemples[2] && exemples[2].weightG, exemples[2] ? (exemples[2].printHours || 0) + (exemples[2].printMin || 0) / 60 : null)}
      <div class="field"><label>Débit volumique annoncé de ton hotend (mm³/s)</label>
        <input type="number" id="cal_q" value="${st.flowMaxMm3s || 15}" step="1" min="1">
        <div class="hint">0,4 mm d'origine : ~15 mm³/s. Buse CHT ou hotend haute vitesse : 20 à 25.</div></div>
      <div class="calcbox" id="cal_out"></div>
    </div>
    <footer>
      <button class="btn ghost" onclick="closeModal()">Annuler</button>
      <button class="btn primary" onclick="appliqueCalibrage()">Utiliser ce débit</button>
    </footer>`);
  const refresh = () => {
    const objs = [0, 1, 2].map(i => ({
      poids: +document.getElementById('cal_g' + i).value || 0,
      heures: +document.getElementById('cal_h' + i).value || 0
    }));
    const d = calibrerDebit(objs);
    const q = +document.getElementById('cal_q').value || 0;
    const theo = debitTheoriqueGParHeure(q);
    document.getElementById('cal_out').innerHTML = d > 0 ? `
      <div class="line"><span>Objets renseignés</span><b>${objs.filter(o => o.poids > 0 && o.heures > 0).length} / 3</b></div>
      <div class="line total"><span>Débit mesuré chez toi</span><b>${num(d, 1)} g/h</b></div>
      <div class="line"><span>Rendement estimé du hotend</span><b>${theo > 0 ? pct(d / theo * 100, 0) : '—'}</b></div>
      <div class="line"><span>Actuel</span><b>${num(st.flowGPerHour, 1)} g/h</b></div>` : `
      <div class="line"><span>Renseigne au moins un objet (poids + durée)</span><b>—</b></div>`;
  };
  ['cal_g0', 'cal_h0', 'cal_g1', 'cal_h1', 'cal_g2', 'cal_h2', 'cal_q'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', refresh);
  });
  refresh();
}

function appliqueCalibrage() {
  const objs = [0, 1, 2].map(i => ({
    poids: +document.getElementById('cal_g' + i).value || 0,
    heures: +document.getElementById('cal_h' + i).value || 0
  }));
  const d = calibrerDebit(objs);
  if (!(d > 0)) return toast('⚠️ Renseigne un poids et une durée');
  S.settings.flowGPerHour = Math.round(d * 10) / 10;
  const q = +document.getElementById('cal_q').value || 0;
  if (q > 0) S.settings.flowMaxMm3s = q;
  save(); closeModal(); render();
  toast(`Débit calibré : ${num(S.settings.flowGPerHour, 1)} g/h ✓`);
}

function saveSettings() {
  const st = S.settings;
  ['printerName', 'shopName', 'shopTagline', 'shopContact', 'currency'].forEach(k => {
    const el = document.getElementById('st_' + k); if (el) st[k] = el.value;
  });
  ['printerPrice', 'printerLifeHours', 'maintenancePerHour', 'printerWatts', 'elecPricePerKwh', 'laborPerHour',
   'postProcessMin', 'failRatePct', 'packagingCost', 'shippingCost', 'platformFeePct', 'paymentFeePct',
   'paymentFeeFixed', 'targetMarginPct', 'vatPct', 'flowGPerHour', 'flowMaxMm3s'].forEach(k => {
    const el = document.getElementById('st_' + k); if (el) st[k] = +el.value || 0;
  });
  st.vatEnabled = document.getElementById('st_vatEnabled').checked;
  ['includeLabor', 'includeWear', 'includePackaging'].forEach(k => {
    const el = document.getElementById('st_' + k);
    if (el) st[k] = el.checked;
  });
  save(); render(); toast('Réglages enregistrés ✓');
}

function download(name, content, type) {
  const b = new Blob([content], { type: type || 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportJSON() {
  download(`printprofit-${todayISO()}.json`, JSON.stringify(S, null, 2));
  toast('Sauvegarde exportée');
}
function importJSON(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.filaments || !d.products) throw new Error('format');
      const base = DEFAULTS();
      S = { ...base, ...d, settings: { ...base.settings, ...(d.settings || {}) } };
      save(); render(); toast('Données importées ✓');
    } catch (e) { toast('⚠️ Fichier invalide'); }
  };
  r.readAsText(f);
}
function csvCell(v) { return `"${String(v ?? '').replace(/"/g, '""')}"`; }
function exportCSV(kind) {
  let head = [], rows = [], name = kind;
  if (kind === 'sales') {
    head = ['Date', 'Objet', 'Client', 'Canal', 'Qté', 'PU', 'CA', 'Coût', 'Frais', 'Bénéfice', 'Marge %', 'Statut'];
    rows = S.sales.map(s => {
      const r = saleProfit(s);
      return [s.date, s.productName, s.customer || '', s.channel || 'Direct', s.qty, s.unitPrice,
        r.gross.toFixed(2), r.cost.toFixed(2), r.fees.toFixed(2), r.profit.toFixed(2), r.margin.toFixed(1), s.status];
    });
  } else if (kind === 'products') {
    head = ['Référence', 'Objet', 'Filament', 'Poids g', 'Heures', 'Coût revient', 'Prix vente', 'Bénéfice', 'Marge %', 'Taux gain %', 'Stock'];
    rows = S.products.map(p => {
      const c = computeProduct(p);
      return [p.sku, p.name, c.filamentName, p.weightG, c.totalHours.toFixed(2), c.costs.variable.toFixed(2),
        c.price.toFixed(2), c.profit.toFixed(2), c.marginPct.toFixed(1), c.markupPct.toFixed(0), p.stock];
    });
  } else {
    head = ['Nom', 'Matière', 'Marque', 'Couleur', 'Bobine g', 'Prix bobine', '€/kg', 'Stock bobines', 'Restant g'];
    rows = S.filaments.map(f => [f.name, f.material, f.brand, f.colorHex, f.spoolWeight, f.spoolPrice,
      (filamentPricePerGram(f) * 1000).toFixed(2), f.stockSpools, spoolLeftG(f)]);
  }
  const csv = '\uFEFF' + [head, ...rows].map(r => r.map(csvCell).join(';')).join('\r\n');
  download(`${name}-${todayISO()}.csv`, csv, 'text/csv;charset=utf-8');
  toast('CSV exporté');
}

        status: mBack > 0 ? 'Livré' : ['À imprimer', 'En cours', 'Expédié', 'Livré'][Math.floor(Math.random() * 4)],
        note: '',
        costSnapshot: { variable: c.costs.variable, filament: c.costs.filament, elec: c.costs.elecWithFail, wear: c.costs.wear, labor: c.costs.labor, packaging: c.costs.packaging }
      });
    }
  }
}

let aiMessages = [], aiPending = null, aiBusy = false, aiContext = 'auto', aiLastError = '';

/* Contexte de la fenêtre : l'assistant répond en priorité sur cet écran. */
const AI_CONTEXT_TABS = {
